# configs/densenet121_config.yaml
# Configuração para os experimentos finais com o modelo DenseNet121 no PCAD.

model_params:
  num_classes: 200

train_params:
  epochs: 100
  batch_size: 32
  learning_rate: 0.1

inference_params:
  batch_size: 32

scheduler_params:
  type: 'StepLR'   # ou 'CosineAnnealingLR'
  step_size: 30    # Parâmetro para StepLR
  gamma: 0.1       # Parâmetro para StepLR
  # T_max: 100       # Parâmetro para CosineAnnealingLR