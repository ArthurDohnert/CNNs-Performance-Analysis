# Estrutura aninhada para compatibilidade com o pipeline atualizado
model_params:
  num_classes: 200

train_params:
  epochs: 5
  batch_size: 128
  learning_rate: 0.1

inference_params:
  batch_size: 128

scheduler_params:
  type: 'StepLR'   # ou 'CosineAnnealingLR'
  step_size: 20    # Parâmetro para StepLR
  gamma: 0.1       # Parâmetro para StepLR
  # T_max: 100       # Parâmetro para CosineAnnealingLR
